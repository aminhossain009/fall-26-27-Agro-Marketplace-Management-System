<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - Agro Mart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- Header -->
  <div>
    <div>
      <a href="../index.html"><i class="fa-solid fa-leaf"></i> Agro Mart</a>
      <div>
        <a href="customer-dashboard.html"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
        <a href="products.html"><i class="fa-solid fa-box"></i> Products</a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
        <a href="../Farmer/profile.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="../Admin/auth/login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </div>
    </div>
  </div>

  <div>
    <h1>Customer Dashboard</h1>
    <p>Welcome, Sumaiya Akter</p>

    <!-- Feature 2: Order Tracking -->
    <div id="order-tracking">
      <h2>1. Order Tracking (#AM-10245)</h2>
      <div>
        <div><i class="fa-solid fa-circle-check"></i> Placed</div>
        <div><i class="fa-solid fa-circle-check"></i> Packed</div>
        <div><i class="fa-solid fa-circle-check"></i> On the way</div>
        <div><i class="fa-regular fa-circle"></i> Delivered</div>
      </div>
      <p>Delivery Person: Zahid Hasan (01311-000006)</p>
    </div>

    <!-- Feature 3: Review and Rating -->
    <div id="review">
      <h2>2. Review and Rating</h2>
      <form action="#">
        <label for="review-product">Which Product?</label>
        <select id="review-product">
          <option>Bogura Potatoes</option>
          <option>Miniket Rice</option>
        </select>
        <label for="rating">Rating</label>
        <select id="rating">
          <option>5 - Excellent</option>
          <option>4 - Good</option>
          <option>3 - Average</option>
          <option>2 - Poor</option>
          <option>1 - Very Poor</option>
        </select>
        <label for="comment">Your Feedback</label>
        <textarea id="comment" rows="3" placeholder="How was the product?"></textarea>
        <button type="submit">Submit Review</button>
      </form>
    </div>
  </div>

  <div>
    <p>&copy; 2026 Agro Mart | Bangladesh</p>
  </div>

</body>

</html>
