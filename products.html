<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agro Mart - Products</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- Header -->
  <div>
    <div>
      <a href="index.html"><i class="fa-solid fa-leaf"></i> Agro Mart</a>
      <div>
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="products.html"><i class="fa-solid fa-box"></i> Products</a>
        <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
        <a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
        <a href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a>
      </div>
    </div>
  </div>

  <div>
    <h1>All Products</h1>
    <p>Search by name or category</p>

    <!-- Search and filter -->
    <form action="products.html">
      <input type="text" placeholder="Product name">
      <select>
        <option>All Categories</option>
        <option>Vegetables</option>
        <option>Fruit</option>
        <option>Rice and Pulses</option>
        <option>Eggs and Dairy</option>
        <option>Spices</option>
      </select>
      <select>
        <option>All Districts</option>
        <option>Bogura</option>
        <option>Rajshahi</option>
        <option>Dinajpur</option>
        <option>Pabna</option>
      </select>
      <button type="submit">Filter</button>
    </form>

    <!-- Product list -->
    <div>
      <div>
        <img src="images/tomato.webp" alt="Fresh potatoes" width="300" height="300">
        <h3>Bogura Potatoes</h3>
        <p>BDT 45 / kg</p>
        <a href="cart.html">Add to Cart</a>
      </div>
      <div>
        <img src="images/rice.jpg" alt="Miniket rice grains" width="300" height="300">
        <h3>Miniket Rice</h3>
        <p>BDT 72 / kg</p>
        <a href="cart.html">Add to Cart</a>
      </div>
      <div>
        <img src="images/mango.jpeg" alt="Ripe Himsagar mangoes" width="300" height="300">
        <h3>Himsagar Mangoes</h3>
        <p>BDT 140 / kg</p>
        <a href="cart.html">Add to Cart</a>
      </div>
      <div>
        <img src="images/eggs.webp" alt="Fresh farm eggs" width="300" height="300">
        <h3>Farm Eggs</h3>
        <p>BDT 50 / 4 eggs</p>
        <a href="cart.html">Add to Cart</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div>
    <p>&copy; 2026 Agro Mart | Bangladesh</p>
  </div>

</body>

</html>
