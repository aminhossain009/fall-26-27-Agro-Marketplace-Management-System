<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Agro Mart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

  <!-- Header -->
  <div>
    <div>
      <a href="index.html"><i class="fa-solid fa-leaf"></i> Agro Mart</a>
      <div>
        <a href="customer-dashboard.html"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
        <a href="products.html"><i class="fa-solid fa-box"></i> Products</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </div>
    </div>
  </div>

  <div>
    <h1>My Profile</h1>
    <p>View and edit your information</p>

    <div>
      <form id="profile-form" action="#">
        <label for="pf-name">Name</label>
        <input type="text" id="pf-name" placeholder="Your name">

        <label for="pf-phone">Mobile</label>
        <input type="text" id="pf-phone" placeholder="Your mobile number">

        <label for="pf-email">Email</label>
        <input type="text" id="pf-email" placeholder="Your email address">

        <label for="pf-district">District</label>
        <select id="pf-district">
          <option value="" disabled selected>Select a district</option>
          <option>Dhaka</option>
          <option>Bogura</option>
          <option>Rajshahi</option>
          <option>Chattogram</option>
        </select>

        <label for="pf-address">Address</label>
        <textarea id="pf-address" rows="2" placeholder="Your address"></textarea>

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <div>
    <p>&copy; 2026 Agro Mart | Bangladesh</p>
  </div>

</body>

</html>
